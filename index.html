<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MTG Draft Night</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <section id="draft-screen" class="draft-screen">
      <div class="draft-progress">
        <p id="draft-pack-pick" class="draft-pack-pick">Pack 1 · Pick 1 / 15</p>
        <p id="draft-phase-label" class="draft-phase-label">
          Pass to your left
        </p>
      </div>

      <div class="draft-timer">
        <span id="draft-timer-seconds" class="draft-timer-seconds">40</span>
      </div>

      <div class="draft-controls">
        <button id="draft-timer-btn" class="btn draft-timer-btn" type="button">
          Start
        </button>
        <button
          id="draft-advance-btn"
          class="btn btn-accent draft-advance-btn"
          type="button"
        >
          Next Pick
        </button>
      </div>

      <button id="draft-skip-btn" class="link-btn draft-skip-btn" type="button">
        Skip to tournament
      </button>
    </section>

    <div id="tournament-screen">
      <section class="standings" id="standings-section">
        <h2>Top 3</h2>
        <div class="podium" id="podium"></div>
      </section>

      <section class="pairing-controls" id="pairing-controls-section">
        <button id="generate-round-btn" class="btn btn-accent" disabled>
          Generate next round pairings
        </button>
        <p id="pairing-hint" class="hint">
          Add exactly 4 or 8 players to start.
        </p>
        <button id="end-tournament-btn" class="btn btn-danger" disabled>
          End tournament
        </button>
      </section>

      <section class="match-log-section" id="match-log-section">
        <h2>Match log</h2>
        <ol id="match-log" class="match-log"></ol>
      </section>

      <section class="players-section">
        <h2>Players</h2>

        <form id="add-player-form" class="add-player-form">
          <input
            type="text"
            id="player-name-input"
            placeholder="Player name"
            aria-label="Player name"
            required
          />
          <input
            type="text"
            id="deck-name-input"
            placeholder="Deck name"
            aria-label="Deck name"
            required
          />
          <button type="submit" class="btn btn-accent">Add player</button>
        </form>

        <div class="table-wrap">
          <table id="players-table">
            <thead>
              <tr>
                <th></th>
                <th>Player</th>
                <th>Deck</th>
                <th>Wins</th>
                <th>Draws</th>
                <th>Losses</th>
                <th>Points</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="players-tbody"></tbody>
          </table>
        </div>
      </section>

      <footer class="app-footer">
        <button id="clear-data-btn" class="link-btn">Clear data</button>
      </footer>
    </div>

    <div id="confirm-modal" class="modal hidden">
      <div class="modal-box">
        <p id="confirm-modal-text">Are you sure?</p>
        <div class="modal-actions">
          <button id="confirm-modal-cancel" class="btn">Cancel</button>
          <button id="confirm-modal-confirm" class="btn btn-danger">
            Confirm
          </button>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
