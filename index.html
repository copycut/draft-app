<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MTG Draft Night</title>
    <link rel="stylesheet" href="style.css?v=1.4" />
  </head>
  <body>
    <section id="player-count-screen" class="player-count-screen">
      <p class="player-count-title">How many players?</p>
      <div class="player-count-options">
        <button
          id="player-count-4-btn"
          class="btn btn-accent player-count-btn"
          type="button"
        >
          4 Players
          <span class="player-count-hint">2 cards/pick</span>
        </button>
        <button
          id="player-count-8-btn"
          class="btn btn-accent player-count-btn"
          type="button"
        >
          8 Players
          <span class="player-count-hint">1 card/pick</span>
        </button>
        <button
          id="player-count-custom-btn"
          class="btn btn-accent player-count-btn"
          type="button"
        >
          Custom
          <span class="player-count-hint">2–12 players</span>
        </button>
      </div>
    </section>

    <section id="draft-screen" class="draft-screen">
      <div class="draft-progress">
        <p id="draft-pack-pick" class="draft-pack-pick">Pack 1 · Pick 1 / 14</p>
        <p id="draft-phase-label" class="draft-phase-label">
          Pass to your left ←
        </p>
      </div>

      <div class="draft-timer">
        <span id="draft-timer-seconds" class="draft-timer-seconds">40</span>
      </div>

      <div class="draft-controls">
        <button id="draft-timer-btn" class="btn draft-timer-btn" type="button">
          Start
        </button>
        <button
          id="draft-advance-btn"
          class="btn btn-accent draft-advance-btn"
          type="button"
        >
          Next Pick
        </button>
      </div>

      <button id="draft-skip-btn" class="link-btn draft-skip-btn" type="button">
        Skip to tournament
      </button>
    </section>

    <div id="tournament-screen">
      <section class="standings" id="standings-section">
        <h2 class="tournament-title">
          <span>Top 3</span>
          <span id="tournament-date" class="tournament-date"></span>
        </h2>
        <div class="podium" id="podium"></div>
      </section>

      <section class="pairing-controls" id="pairing-controls-section">
        <button id="generate-round-btn" class="btn btn-accent" disabled>
          Next round pairings
        </button>
        <div class="round-timer">
          <span id="round-timer-seconds" class="round-timer-seconds"
            >50:00</span
          >
          <button
            id="round-timer-btn"
            class="btn round-timer-btn"
            type="button"
          >
            Start
          </button>
        </div>
        <p id="pairing-hint" class="hint">
          Add exactly 4 or 8 players to start.
        </p>
        <button
          id="end-tournament-btn"
          class="btn btn-outline btn-danger"
          disabled
        >
          End tournament
        </button>
      </section>

      <section class="match-log-section" id="match-log-section">
        <h2>Match log</h2>
        <ol id="match-log" class="match-log"></ol>
      </section>

      <section class="players-section">
        <h2>Players</h2>

        <form id="add-player-form" class="add-player-form">
          <input
            type="text"
            id="player-name-input"
            placeholder="Player name"
            aria-label="Player name"
            required
          />
          <input
            type="text"
            id="deck-name-input"
            placeholder="Deck name"
            aria-label="Deck name"
            required
          />
          <div id="deck-color-toggles" class="color-toggle-group">
            <button
              type="button"
              class="color-toggle-btn"
              data-color="W"
              aria-label="White"
              aria-pressed="false"
            >
              <img src="assets/white.svg" width="24" height="24" alt="W" />
            </button>
            <button
              type="button"
              class="color-toggle-btn"
              data-color="U"
              aria-label="Blue"
              aria-pressed="false"
            >
              <img src="assets/blue.svg" width="24" height="24" alt="U" />
            </button>
            <button
              type="button"
              class="color-toggle-btn"
              data-color="B"
              aria-label="Black"
              aria-pressed="false"
            >
              <img src="assets/black.svg" width="24" height="24" alt="B" />
            </button>
            <button
              type="button"
              class="color-toggle-btn"
              data-color="R"
              aria-label="Red"
              aria-pressed="false"
            >
              <img src="assets/red.svg" width="24" height="24" alt="R" />
            </button>
            <button
              type="button"
              class="color-toggle-btn"
              data-color="G"
              aria-label="Green"
              aria-pressed="false"
            >
              <img src="assets/green.svg" width="24" height="24" alt="G" />
            </button>
          </div>
          <button type="submit" class="btn btn-accent">Add player</button>
        </form>

        <div class="table-wrap">
          <table id="players-table">
            <thead>
              <tr>
                <th></th>
                <th>Player</th>
                <th>Deck</th>
                <th>Wins</th>
                <th>Draws</th>
                <th>Losses</th>
                <th>Points</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="players-tbody"></tbody>
          </table>
        </div>
      </section>

      <footer class="app-footer">
        <button id="clear-data-btn" class="link-btn">Clear data</button>
      </footer>
    </div>

    <div id="custom-count-modal" class="modal hidden">
      <div class="modal-box">
        <p>How many players?</p>
        <input
          id="custom-count-input"
          type="number"
          min="2"
          max="12"
          step="1"
          inputmode="numeric"
        />
        <div class="modal-actions">
          <button id="custom-count-cancel" class="btn">Cancel</button>
          <button id="custom-count-confirm" class="btn btn-accent" disabled>
            Confirm
          </button>
        </div>
      </div>
    </div>

    <div id="confirm-modal" class="modal hidden">
      <div class="modal-box">
        <p id="confirm-modal-text">Are you sure?</p>
        <div class="modal-actions">
          <button id="confirm-modal-cancel" class="btn">Cancel</button>
          <button id="confirm-modal-confirm" class="btn btn-danger">
            Confirm
          </button>
        </div>
      </div>
    </div>

    <script src="script.js?v=1.4"></script>
  </body>
</html>
